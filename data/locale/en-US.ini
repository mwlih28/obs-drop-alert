Optimizer.AutoHighPriority="Set OBS process priority to High (HIGH)"
Optimizer.AutoHighPriority.Tip="Prevents OBS from starving for CPU/GPU resources and dropping frames while playing games or under heavy load."
Optimizer.AutoMultimediaTimer="Enable 1ms Windows high-precision multimedia timer"
Optimizer.AutoMultimediaTimer.Tip="Locks Windows multimedia timer resolution to 1ms. Eliminates frame timing jitter and micro-stuttering."
Optimizer.EnablePreWarning="Enable early warning (Yellow Stage) mode"
Optimizer.EnablePreWarning.Tip="Fires a yellow advisory warning when reaching 50% of threshold to catch issues before they turn into critical drops."
Optimizer.AutoPausePreview="Automatically pause OBS preview on render drop (Auto-Pilot)"
Optimizer.AutoPausePreview.Tip="When GPU render lag occurs, temporarily pauses the OBS preview window to slash GPU workload by 10-20% and rescue the live broadcast."
Button.OptimizeNow="⚡ Optimize OBS & System Now"
Button.OptimizeNow.Tip="Immediately applies High Process Priority, 1ms Windows timer, and checks overall system readiness."

