Monitor.Network="Network drops (streaming)"
Monitor.Network.Tip="Frames dropped because the upload could not keep up. This is what streamers usually mean by 'dropped frames'."
Monitor.Render="Render lag (GPU)"
Monitor.Render.Tip="Frames missed because the GPU could not compose the scene in time. Common when a game and OBS share one GPU."
Monitor.Encoder="Encoder overload (CPU)"
Monitor.Encoder.Tip="Frames skipped because the encoder could not keep up. Usually means the x264 preset is too heavy."
Monitor.Disk="Recording / disk problems"
Monitor.Disk.Tip="Alert when the recording output starts dropping frames."
Monitor.DiskFree.Tip="Alert when free space in the recording folder falls below this. Only checked while recording, since the folder is not known otherwise."

