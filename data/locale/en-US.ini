Tuning.Trigger.Tip="The threshold must be exceeded this many checks in a row before the alarm fires. Prevents flickering right at the threshold."
Tuning.Clear="Clear after"
Tuning.Clear.Tip="The alarm turns off after this many seconds without any threshold being exceeded."
Tuning.OnlyWhenActive="Only alert while streaming or recording"

