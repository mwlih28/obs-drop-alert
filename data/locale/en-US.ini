Tuning.Window="Measurement window"
Tuning.Window.Tip="Drop rate is measured over this many seconds. The percentages OBS shows in its Stats window are cumulative over the whole session and react far too slowly for a live alert."
Tuning.Poll="Check every"
Tuning.Trigger="Samples before alarm"
Tuning.Trigger.Tip="The threshold must be exceeded this many checks in a row before the alarm fires. Prevents flickering right at the threshold."
Tuning.Clear="Clear after"
Tuning.Clear.Tip="The alarm turns off after this many seconds without any threshold being exceeded."
Tuning.OnlyWhenActive="Only alert while streaming or recording"

Button.Browse="Browse..."
Button.Preview="Play"
Button.Test="Test alert"
Button.Test.Tip="Runs the whole alert chain as if a drop had happened, so you can tune the look without waiting for a real one. Uses the values currently in this window."

Alert.Network.Title="Network drops"
Alert.Network.Cause="Your connection cannot carry the stream bitrate, so OBS is dropping frames."
Alert.Network.Hint="Lower the bitrate or switch to a wired connection. Viewers are seeing stutter right now."
Alert.Render.Title="Rendering is lagging"
Alert.Render.Cause="The GPU cannot draw the scene in time. It is usually busy with something else, most often a game."
Alert.Render.Hint="Cap the game's FPS or reduce the number of sources and effects in OBS."
Alert.Encoder.Title="Encoder cannot keep up"
Alert.Encoder.Cause="The encoder cannot compress frames in time - CPU or GPU load is too high."
Alert.Encoder.Hint="Lower resolution or FPS, use a faster encoder preset, or switch to NVENC/AMF."
Alert.Record.Title="Recording is dropping frames"
Alert.Record.Cause="The recording output cannot write frames, usually because the disk is too slow."
Alert.Record.Hint="Record to a faster disk or lower the recording bitrate."
Alert.Disk.Title="Disk is filling up"
Alert.Disk.Cause="The recording disk is running out of free space."
Alert.Disk.Hint="Free up space or the recording will stop on its own."
Alert.OutputError.Title="Encoding error"
Alert.OutputError.Cause="OBS could not keep the output running and reported an error. The stream or recording may have stopped."
Alert.OutputError.Hint="OBS reported:"
Alert.StreamDropped.Title="Stream disconnected"
Alert.StreamDropped.Cause="The connection to the server dropped and OBS is trying to reconnect."
Alert.StreamDropped.Hint="Check your internet. Viewers cannot see you right now."
Alert.Stall.Title="OBS froze"
Alert.Stall.Cause="OBS stopped responding for %1 seconds (a 'not responding' style stall)."
Alert.Stall.Hint="System load is usually the cause; try closing heavy background applications."
Alert.None.Title="No problem"

