Button.Test.Tip="Runs the whole alert chain as if a drop had happened, so you can tune the look without waiting for a real one. Uses the values currently in this window."

Alert.Network.Title="Network drop"
Alert.Network.Cause="Your connection cannot carry the stream bitrate, so OBS is dropping frames."
Alert.Network.Hint="Lower the bitrate or switch to a wired connection. Viewers are seeing stutter right now."
Alert.Render.Title="Render lag"
Alert.Render.Cause="GPU cannot render frames in time, usually because another heavy program (e.g. game) is using the GPU."
Alert.Render.Hint="Cap your game FPS or reduce heavy filters/sources in OBS."
Alert.Encoder.Title="Encoder overload"
Alert.Encoder.Cause="Encoder cannot compress frames in time; CPU or GPU encoding load is too high."
Alert.Encoder.Hint="Lower your output resolution or FPS, speed up the encoder preset, or switch to NVENC/AMF."
Alert.Record.Title="Recording frame loss"
Alert.Record.Cause="Recording output cannot write frames to storage fast enough, usually storage bottleneck."
Alert.Record.Hint="Record to a faster drive or lower recording bitrate."
Alert.Disk.Title="Disk running low"
Alert.Disk.Cause="Free storage space on the recording drive is almost exhausted."
Alert.Disk.Hint="Free up storage space or recording will stop unexpectedly."
Alert.OutputError.Title="Encoding failure"
Alert.OutputError.Cause="OBS encountered an output error. Stream or recording may have stopped."
Alert.OutputError.Hint="The exact OBS error output is shown below."
Alert.StreamDropped.Title="Stream disconnected"
Alert.StreamDropped.Cause="Connection to the streaming server was lost; OBS is attempting to reconnect."
Alert.StreamDropped.Hint="Check your internet connection. Viewers cannot see or hear you right now."
Alert.Stall.Title="OBS stall"
Alert.Stall.Cause="OBS stopped responding for %1 seconds (a 'not responding' freeze)."
Alert.Stall.Hint="System load is usually the cause; close heavy background applications."
Alert.None.Title="No problem"

